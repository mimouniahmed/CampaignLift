[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "campaignlift"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "xgboost",
]

[project.scripts]
campaignlift = "campaignlift.cli:main"

[tool.setuptools.packages.find]
include = ["campaignlift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
