name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Télécharger le jeu de données Hillstrom
        run: |
          mkdir -p data
          curl -fsSL -o data/hillstrom.csv "http://www.minethatdata.com/Kevin_Hillstrom_MineThatData_E-MailAnalytics_DataMiningChallenge_2008.03.20.csv"
      - name: Tests unitaires et de reproduction
        run: |
          set -o pipefail
          pytest -v -rf --tb=line 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR)|Error" pytest.log | head -20 | sed 's/^/::error::/'
            exit 1
          }
